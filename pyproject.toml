[project]
name = "university-student-assistant"
version = "0.1.0"
description = "Stage 1 foundation for an explainable university student services assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "langgraph>=0.2,<1",
  "chromadb>=0.5,<1",
  "sentence-transformers>=3,<4",
  "streamlit>=1.38,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
